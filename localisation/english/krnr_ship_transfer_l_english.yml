KRNR_SHIP_TRANSFER_TITLE:0 "Naval Ship Transfer"
KRNR_SHIP_TRANSFER_ACTION_DESC:0 "Pick ship types and amounts with the round +/- buttons. Both mode buttons are options: with neither selected the chosen types and amounts are transferred, with Random or Named TANGO selected that mode is used instead, and clicking it again cancels. Then click Submit. Named mode requires one ship renamed to TANGO."
