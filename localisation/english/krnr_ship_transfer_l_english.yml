KRNR_MODE_RANDOM_TOOLTIP:0 "§GClick to select§!: random mode\nTransfers ship by ship for the selected types and amounts.\n§YClick again to cancel.§!"
KRNR_MODE_NAMED_TOOLTIP:0 "§GClick to select§!: named TANGO mode\nTransfers the single ship renamed to TANGO, one type only.\n§YClick again to cancel.§!"
