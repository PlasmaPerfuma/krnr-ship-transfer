KRNR_SHIP_TRANSFER_ACTION_DESC:0 "用圆形加减按钮选择舰种和数量。两个模式按钮都是选项：不选任何一个时按所选舰种与数量转移；选中随机舰船或 TANGO 指定舰后按对应模式转移，再点一次即可取消。最后点击递交执行。指定舰模式需要先把一艘舰船改名为 TANGO。"
